# HMT merged RGB-T dataset (update v6.2): RGB camera and cube-projection images share the rgb slot,
# thermal images fill the thermal slot, and frames without a companion get a same-size black image.
# Splits come from train.txt / val.txt (primary-modality paths only).

path: Y:/dataset/hmt_merged_v6.2
train: train.txt
val: val.txt

channels: 4

names:
  0: Corrosion
  1: Efflorescene
  2: Delaminate
  3: Broken
  4: peeling
  5: Hollow Confirmed
  6: Hollow Suspected
  7: Leakage

modalities:
  - {name: rgb, path: images/rgb, channels: 3, suffix: .jpg, color: bgr}
  - {name: thermal, path: images/thermal, channels: 1, suffix: .png}
