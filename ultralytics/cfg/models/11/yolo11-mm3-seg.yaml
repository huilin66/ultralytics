# Three-branch multi-modal YOLO11 instance segmentation model.
# Input order: RGB (3) + thermal (1) + depth (1). Change ModalSplit and the Index entries to use any modality count.
nc: 80
channels: 5
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # Split the channel stack, then build one independent P3/P4/P5 encoder per modality.
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # 0: RGB, thermal, depth

  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 6 RGB P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 8 RGB P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 12 RGB P5

  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 18 thermal P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 20 thermal P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 24 thermal P5

  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 30 depth P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 32 depth P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 36 depth P5

  # Fuse each pyramid scale, then use the stock YOLO11 PAN and Segment head.
  - [[6, 18, 30], 1, Concat, [1]]
  - [-1, 1, Conv, [512, 1, 1]] # 38 fused P3
  - [[8, 20, 32], 1, Concat, [1]]
  - [-1, 1, Conv, [512, 1, 1]] # 40 fused P4
  - [[12, 24, 36], 1, Concat, [1]]
  - [-1, 1, Conv, [1024, 1, 1]] # 42 fused P5

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 40], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 45 P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 38], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 48 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 45], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 51 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 42], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 54 P5
  - [[48, 51, 54], 1, Segment, [nc, 32, 256]]
