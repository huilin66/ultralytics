# YOLOv10x image classification model
# YOLOv10x backbone with a classification head for E6 crop classification.
# Task docs: https://docs.ultralytics.com/tasks/classify

# Parameters
nc: 1000 # overwritten by the classification dataset class count
scales:
  # [depth, width, max_channels]
  x: [1.00, 1.25, 512]

# YOLOv10x backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fCIB, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fCIB, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] # 10

# Classification head
head:
  - [-1, 1, Classify, [nc]]
