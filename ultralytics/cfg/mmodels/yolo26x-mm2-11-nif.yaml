# YOLO26x two-modality nape-in fusion, 1+1 layout. P3/P4 are fused at encoder exits; P5 is fused inside the
# expanded SPPF/C2PSA nape. Replace the marked MultiModalFusion node for a complex NIF experiment.
# Input order: thermal (1) + depth (1).
nc: 80
channels: 2
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [1, 1]
  fusion: NIF
  fusion_points: [encoder_P3, encoder_P4, nape_P5]
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[1, 1]]]
  - [0, 1, Index, [1, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [[6, 16], 1, MultiModalFusion, [concat]] # P3 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P3
  - [[8, 18], 1, MultiModalFusion, [concat]] # P4 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P4
  - [10, 1, SPPF, [1024, 5, 3, True]]
  - [20, 1, SPPF, [1024, 5, 3, True]]
  - [[25, 26], 1, MultiModalFusion, [concat]] # nape fusion
  - [-1, 1, Conv, [1024, 1, 1]] # fused nape P5
  - [-1, 2, C2PSA, [1024]]

head:
  - [29, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[30, 24], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[33, 22], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[36, 32], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[39, 29], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[35, 38, 41], 1, Detect, [nc]]
