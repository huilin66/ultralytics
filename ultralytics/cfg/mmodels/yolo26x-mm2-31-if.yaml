# YOLO26x two-modality input fusion, 3+1 layout: RGB (3) + one single-channel modality (thermal or depth).
# Both modalities are channel-stacked before one 4-channel encoder, matching the mm3 modality split.
nc: 80
channels: 4
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [3, 1]
  fusion: IF
  fusion_points: []
  pretrained: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[11, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[14, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[17, 13], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[20, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[16, 19, 22], 1, Detect, [nc]]
