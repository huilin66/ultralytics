# yolov8s three-modality head fusion: per-modality head projections fuse P3/P4/P5 before one Detect.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
scale: s
multimodal:
  input_sections: [3, 1, 1]
  fusion: HF
  operator: concat
  fusion_points: ["head_P3", "head_P4", "head_P5"]
  share_weight: false
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.5, 1024]
  m: [0.67, 0.75, 768]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.25, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 29], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 54], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 52], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 60], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 57], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [17, 1, Conv, [256, 1, 1]] # head projection
  - [20, 1, Conv, [512, 1, 1]] # head projection
  - [23, 1, Conv, [1024, 1, 1]] # head projection
  - [40, 1, Conv, [256, 1, 1]] # head projection
  - [43, 1, Conv, [512, 1, 1]] # head projection
  - [46, 1, Conv, [1024, 1, 1]] # head projection
  - [63, 1, Conv, [256, 1, 1]] # head projection
  - [66, 1, Conv, [512, 1, 1]] # head projection
  - [69, 1, Conv, [1024, 1, 1]] # head projection
  - [[70, 73, 76], 1, MultiModalFusion, ["concat"]] # fuse neck P0
  - [-1, 1, Conv, [256, 1, 1]] # neck-P0-fused
  - [[71, 74, 77], 1, MultiModalFusion, ["concat"]] # fuse neck P1
  - [-1, 1, Conv, [512, 1, 1]] # neck-P1-fused
  - [[72, 75, 78], 1, MultiModalFusion, ["concat"]] # fuse neck P2
  - [-1, 1, Conv, [1024, 1, 1]] # neck-P2-fused
  - [[80, 82, 84], 1, Detect, ["nc"]] # Detect(P3, P4, P5)

