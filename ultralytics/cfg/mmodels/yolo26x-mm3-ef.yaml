# YOLO26x three-modality encoder fusion: fuse encoder P3/P4/P5, then run one shared SPPF/C2PSA nape and neck.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
scale: x
end2end: True
reg_max: 1
multimodal:
  fusion: EF
  fusion_points: [encoder_P3, encoder_P4, encoder_P5]
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]]

  # RGB encoder: P3=6, P4=8, P5=10.
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 10

  # Thermal encoder: P3=16, P4=18, P5=20.
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 16
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 18
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 20

  # Depth encoder: P3=26, P4=28, P5=30.
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 26
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 28
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 30

  # Project each encoder fusion to the stock YOLO26 channel width, then run one shared nape.
  - [[6, 16, 26], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]] # 32-fused P3
  - [[8, 18, 28], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]] # 34-fused P4
  - [[10, 20, 30], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [1024, 1, 1]] # 36-fused P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 37-shared nape P5
  - [-1, 2, C2PSA, [1024]] # 38

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]] # cat fused P4
  - [-1, 2, C3k2, [512, True]] # 41

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]] # cat fused P3
  - [-1, 2, C3k2, [256, True]] # 44 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 41], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 47 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 38], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 50 (P5/32-large)

  - [[44, 47, 50], 1, Detect, [nc]] # Detect(P3, P4, P5)
