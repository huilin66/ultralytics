# yolov9c three-modality input fusion: RGB (3) + thermal (1) + depth (1) -> one 5-channel encoder.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  fusion: IF
  operator: concat
  fusion_points: []
  share_weight: false

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, SPPELAN, [512, 256]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 1]]
  - [-1, 1, ADown, [256]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [[15, 18, 21], 1, Detect, ["nc"]]

