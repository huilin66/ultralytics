# yolo12x three-modality backbone fusion: three complete modality backbones fuse P3/P4/P5, then one shared neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
scale: x
multimodal:
  fusion: BF
  fusion_points: ["backbone_P3", "backbone_P4", "backbone_P5"]
  pretrained: false
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [[6, 16, 26], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [512, 1, 1]] # P3-fused
  - [[8, 18, 28], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [512, 1, 1]] # P4-fused
  - [[10, 20, 30], 1, MultiModalFusion, ["concat"]] # fuse P5
  - [-1, 1, Conv, [1024, 1, 1]] # P5-fused

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 39], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 36], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [[42, 45, 48], 1, Detect, ["nc"]]

