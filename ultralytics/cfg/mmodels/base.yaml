# Shared multi-modal contract for every model file in this directory.
# Ultralytics YAML has no cross-file inheritance, so MultiModalModelMixin merges this file into each
# model config at load time (a key declared by the model file always wins).
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  operator: concat
  share_weight: false
  # Donor family only. The layer mapping is derived from the donor and target graphs by
  # ultralytics/models/multimodal/pretrained.py; a template that has no matching donor
  # overrides this with `pretrained: false`.
  pretrained:
    source: yolov8
