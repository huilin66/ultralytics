# Shared multi-modal contract for every model file in this directory.
# Ultralytics YAML has no cross-file inheritance, so MultiModalModelMixin merges this file into each
# model config at load time (a key declared by the model file always wins).
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  operator: concat
  share_weight: false
  # Any COCO checkpoint of the template's own family and scale is accepted (`auto`); the layer
  # mapping is derived from the donor and target graphs by
  # ultralytics/models/multimodal/pretrained.py. Pin a family (e.g. `source: yolo11`) to reject
  # mismatched checkpoints, or set `pretrained: false` to disable the transfer.
  pretrained:
    source: auto
