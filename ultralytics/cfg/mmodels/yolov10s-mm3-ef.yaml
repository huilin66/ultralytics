# yolov10s three-modality encoder fusion: modality-specific encoders fuse P3/P4/P5, then one shared nape/neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
scale: s
multimodal:
  input_sections: [3, 1, 1]
  fusion: EF
  operator: concat
  fusion_points: ["encoder_P3", "encoder_P4", "encoder_P5"]
  share_weight: false
scales:
  s: [0.33, 0.5, 1024]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, SCDown, [1024, 3, 2]]
  - [-1, 3, C2fCIB, [1024, true, true]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, SCDown, [1024, 3, 2]]
  - [-1, 3, C2fCIB, [1024, true, true]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, SCDown, [1024, 3, 2]]
  - [-1, 3, C2fCIB, [1024, true, true]]
  - [[6, 16, 26], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [256, 1, 1]] # P3-fused
  - [[8, 18, 28], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [512, 1, 1]] # P4-fused
  - [[10, 20, 30], 1, MultiModalFusion, ["concat"]] # fuse P5
  - [-1, 1, Conv, [1024, 1, 1]] # P5-fused
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 41], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 38], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [1024, true, true]]
  - [[44, 47, 50], 1, v10Detect, ["nc"]]

