# YOLO26x nape-in fusion. P3/P4 are fused at encoder exits; P5 is fused inside the expanded SPPF/C2PSA nape.
# Replace the marked MultiModalFusion node with a registered attention/gating module for a complex NIF experiment.
nc: 80
channels: 5
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [3, 1, 1]
  fusion: NIF
  operator: concat
  fusion_points: [encoder_P3, encoder_P4, nape_P5]
  share_weight: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]]

  # RGB encoder: P3=6, P4=8, P5=10.
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 10

  # Thermal encoder: P3=16, P4=18, P5=20.
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 16
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 18
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 20

  # Depth encoder: P3=26, P4=28, P5=30.
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 26
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 28
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]] # 30

  - [[6, 16, 26], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]] # 32-fused P3
  - [[8, 18, 28], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]] # 34-fused P4

  # Expanded nape: modality-specific SPPF -> in-nape fusion -> shared projection/C2PSA.
  - [10, 1, SPPF, [1024, 5, 3, True]] # 35
  - [20, 1, SPPF, [1024, 5, 3, True]] # 36
  - [30, 1, SPPF, [1024, 5, 3, True]] # 37
  - [[35, 36, 37], 1, MultiModalFusion, [concat]] # 38; replace for a complex NIF module if required
  - [-1, 1, Conv, [1024, 1, 1]] # 39
  - [-1, 2, C2PSA, [1024]] # 40-fused nape P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]] # cat fused P4
  - [-1, 2, C3k2, [512, True]] # 43

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]] # cat fused P3
  - [-1, 2, C3k2, [256, True]] # 46 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 43], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 49 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 40], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 52 (P5/32-large)

  - [[46, 49, 52], 1, Detect, [nc]] # Detect(P3, P4, P5)
