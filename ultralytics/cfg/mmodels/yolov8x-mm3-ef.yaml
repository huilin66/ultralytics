# YOLOv8x three-modality encoder fusion: fuse encoder P3/P4/P5, then run one shared SPPF nape and neck.
nc: 80
channels: 5
scale: x
multimodal:
  input_sections: [3, 1, 1]
  fusion: EF
  operator: concat
  fusion_points: [encoder_P3, encoder_P4, encoder_P5]
  share_weight: false
  pretrained:
    source: yolov8
    copies:
      - source: [0, 8]
        target: [2, 10]
        input_init: copy
      - source: [0, 8]
        target: [12, 20]
        input_init: mean
      - source: [0, 8]
        target: [22, 30]
        input_init: mean
      - source: [9, 22]
        target: [37, 50]
    fusion_projections: [32, 34, 36]
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]]

  # RGB encoder: P3=6, P4=8, P5=10.
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]

  # Thermal encoder: P3=16, P4=18, P5=20.
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]

  # Depth encoder: P3=26, P4=28, P5=30.
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]

  # Project each encoder fusion to the stock YOLOv8 channel width.
  - [[6, 16, 26], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [256, 1, 1]] # 32-fused P3
  - [[8, 18, 28], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]] # 34-fused P4
  - [[10, 20, 30], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [1024, 1, 1]]
  - [-1, 1, SPPF, [1024, 5]] # 37-shared nape P5

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 40-P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 43-P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 40], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 46-P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 49-P5
  - [[43, 46, 49], 1, Detect, [nc]]
