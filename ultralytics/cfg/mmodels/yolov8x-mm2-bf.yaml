# YOLOv8x two-modality backbone fusion: two modality-specific backbones feed one shared neck and Detect head.
nc: 80
channels: 6
scale: x
multimodal:
  input_sections: [3, 3]
  fusion: BF
  operator: concat
  fusion_points: [backbone_P3, backbone_P4, backbone_P5]
  share_weight: false
  pretrained:
    source: yolov8
    copies:
    - source: [0, 9]
      target: [2, 11]
      input_init: copy
    - source: [0, 9]
      target: [13, 22]
      input_init: mean
    - source: [10, 22]
      target: [29, 41]
    fusion_projections: [24, 26, 28]
    identity_projections: []
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.5, 1024]
  m: [0.67, 0.75, 768]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.25, 512]
backbone:
  - [-1, 1, ModalSplit, [[3, 3]]]
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
  - [0, 1, Index, [3, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
  - [[6, 17], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [[8, 19], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [[11, 22], 1, MultiModalFusion, [concat]]
  - [-1, 1, Conv, [1024, 1, 1]]
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 26], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[34, 37, 40], 1, Detect, [nc]]
