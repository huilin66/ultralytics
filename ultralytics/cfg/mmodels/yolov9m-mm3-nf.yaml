  - [-1, 1, AConv, [180]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [240]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
