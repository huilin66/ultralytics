# yolov9m three-modality neck fusion: modality-specific backbones and necks fuse P3/P4/P5 before one Detect.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
multimodal:
  fusion: NF
  fusion_points: ["neck_P3", "neck_P4", "neck_P5"]
  pretrained: false

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]
  - [-1, 1, AConv, [240]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [360]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [480]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [-1, 1, SPPELAN, [480, 240]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [180]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [240]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]
  - [-1, 1, AConv, [240]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [360]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [480]]
