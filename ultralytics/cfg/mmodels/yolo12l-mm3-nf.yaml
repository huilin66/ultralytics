# yolo12l three-modality neck fusion: modality-specific backbones and necks fuse P3/P4/P5 before one Detect.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
scale: l
multimodal:
  fusion: NF
  fusion_points: ["neck_P3", "neck_P4", "neck_P5"]
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 35], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 52], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 50], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 57], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 54], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [[16, 38, 60], 1, MultiModalFusion, ["concat"]] # fuse neck P0
  - [-1, 1, Conv, [256, 1, 1]] # neck-P0-fused
  - [[19, 41, 63], 1, MultiModalFusion, ["concat"]] # fuse neck P1
  - [-1, 1, Conv, [512, 1, 1]] # neck-P1-fused
  - [[22, 44, 66], 1, MultiModalFusion, ["concat"]] # fuse neck P2
  - [-1, 1, Conv, [1024, 1, 1]] # neck-P2-fused
  - [[68, 70, 72], 1, Detect, ["nc"]] # Detect(P3, P4, P5)

