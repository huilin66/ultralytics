# YOLO26x two-modality encoder fusion, 1+1 layout: fuse encoder P3/P4/P5, then run one shared SPPF/C2PSA nape and neck.
# Input order: thermal (1) + depth (1).
nc: 80
channels: 2
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [1, 1]
  fusion: EF
  operator: concat
  fusion_points: [encoder_P3, encoder_P4, encoder_P5]
  share_weight: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[1, 1]]]
  - [0, 1, Index, [1, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [[6, 16], 1, MultiModalFusion, [concat]] # P3 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P3
  - [[8, 18], 1, MultiModalFusion, [concat]] # P4 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P4
  - [[10, 20], 1, MultiModalFusion, [concat]] # P5 fusion
  - [-1, 1, Conv, [1024, 1, 1]] # fused P5
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]

head:
  - [26, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[29, 24], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[32, 22], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[35, 31], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[38, 26], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[34, 37, 40], 1, Detect, [nc]]
