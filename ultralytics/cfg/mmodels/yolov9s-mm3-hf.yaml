# yolov9s three-modality head fusion: modality-specific backbones/necks and per-scale head projections fuse before one Detect.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  fusion: HF
  operator: concat
  fusion_points: ["head_P3", "head_P4", "head_P5"]
  share_weight: false

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, ELAN1, [64, 64, 32]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [-1, 1, AConv, [192]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, AConv, [256]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 3]]
  - [-1, 1, SPPELAN, [256, 128]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [-1, 1, AConv, [96]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, AConv, [128]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 3]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, ELAN1, [64, 64, 32]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [-1, 1, AConv, [192]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, AConv, [256]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 3]]
  - [-1, 1, SPPELAN, [256, 128]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 29], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [-1, 1, AConv, [96]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [192, 192, 96, 3]]
  - [-1, 1, AConv, [128]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 3]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, ELAN1, [64, 64, 32]]
  - [-1, 1, AConv, [128]]
