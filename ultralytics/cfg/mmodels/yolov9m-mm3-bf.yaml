# yolov9m three-modality backbone fusion: three complete modality backbones fuse P3/P4/P5, then one shared neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  fusion: BF
  operator: concat
  fusion_points: ["backbone_P3", "backbone_P4", "backbone_P5"]
  share_weight: false

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]
  - [-1, 1, AConv, [240]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [360]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [480]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [-1, 1, SPPELAN, [480, 240]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]
  - [-1, 1, AConv, [240]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [360]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [480]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [-1, 1, SPPELAN, [480, 240]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]
  - [-1, 1, AConv, [240]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [360]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [480]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [-1, 1, SPPELAN, [480, 240]]
  - [[6, 17, 28], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [240, 1, 1]] # P3-fused
  - [[8, 19, 30], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [360, 1, 1]] # P4-fused
  - [[11, 22, 33], 1, MultiModalFusion, ["concat"]] # fuse P5
  - [-1, 1, Conv, [480, 1, 1]] # P5-fused

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 35], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]
  - [-1, 1, AConv, [180]]
  - [[-1, 42], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]
  - [-1, 1, AConv, [240]]
  - [[-1, 39], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]
  - [[45, 48, 51], 1, Detect, ["nc"]]

