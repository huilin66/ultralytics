# yolov9e three-modality backbone fusion: three complete modality backbones fuse P3/P4/P5, then one shared neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
channels: 5
multimodal:
  input_sections: [3, 1, 1]
  fusion: BF
  operator: concat
  fusion_points: ["backbone_P3", "backbone_P4", "backbone_P5"]
  share_weight: false

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 2]]
