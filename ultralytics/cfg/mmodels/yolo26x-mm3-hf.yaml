# YOLO26x head-feature fusion: modality-specific backbones/necks and per-scale head projections fuse before one Detect.
# This is differentiable feature fusion, not deployment-time score fusion or independent decoded-box fusion.
nc: 80
scale: x
end2end: True
reg_max: 1
multimodal:
  fusion: HF
  fusion_points: [head_P3, head_P4, head_P5]
  pretrained: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]]

  # RGB backbone: P3=6, P4=8, P5=12.
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 6
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 12

  # Thermal backbone: P3=18, P4=20, P5=24.
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 18
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 20
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 24

  # Depth backbone: P3=30, P4=32, P5=36.
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 30
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 32
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 36

head:
  # RGB neck: P3=42, P4=45, P5=48.
  - [12, 1, nn.Upsample, [None, 2, "nearest"]] # 37
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 39
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 42
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 39], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 45
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 48

  # Thermal neck: P3=54, P4=57, P5=60.
  - [24, 1, nn.Upsample, [None, 2, "nearest"]] # 49
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 51
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 54
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 51], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 57
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 60

  # Depth neck: P3=66, P4=69, P5=72.
  - [36, 1, nn.Upsample, [None, 2, "nearest"]] # 61
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 63
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 66
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 63], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 69
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 36], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 72

  # Per-modality head-feature projections.
  - [42, 1, Conv, [256, 1, 1]] # 73
  - [45, 1, Conv, [512, 1, 1]] # 74
  - [48, 1, Conv, [1024, 1, 1]] # 75
  - [54, 1, Conv, [256, 1, 1]] # 76
  - [57, 1, Conv, [512, 1, 1]] # 77
  - [60, 1, Conv, [1024, 1, 1]] # 78
  - [66, 1, Conv, [256, 1, 1]] # 79
  - [69, 1, Conv, [512, 1, 1]] # 80
  - [72, 1, Conv, [1024, 1, 1]] # 81

  # Fuse head features; the stock Detect remains the single training/export contract.
  - [[73, 76, 79], 1, MultiModalFusion, [concat]] # 82
  - [-1, 1, Conv, [256, 1, 1]] # 83-fused P3
  - [[74, 77, 80], 1, MultiModalFusion, [concat]] # 84
  - [-1, 1, Conv, [512, 1, 1]] # 85-fused P4
  - [[75, 78, 81], 1, MultiModalFusion, [concat]] # 86
  - [-1, 1, Conv, [1024, 1, 1]] # 87-fused P5
  - [[83, 85, 87], 1, Detect, [nc]] # Detect(P3, P4, P5)
