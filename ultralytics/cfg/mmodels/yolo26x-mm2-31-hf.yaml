# YOLO26x two-modality head-feature fusion, 3+1 layout: modality-specific backbones/necks and per-scale head
# projections fuse before one Detect. This is differentiable feature fusion, not score or decoded-box fusion.
nc: 80
channels: 4
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [3, 1]
  fusion: HF
  fusion_points: [head_P3, head_P4, head_P5]
  pretrained: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1]]]
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]

head:
  - [12, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[25, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[28, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[31, 27], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[34, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [24, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[37, 20], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[40, 18], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[43, 39], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[46, 24], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [30, 1, Conv, [256, 1, 1]]
  - [33, 1, Conv, [512, 1, 1]]
  - [36, 1, Conv, [1024, 1, 1]]
  - [42, 1, Conv, [256, 1, 1]]
  - [45, 1, Conv, [512, 1, 1]]
  - [48, 1, Conv, [1024, 1, 1]]
  - [[49, 52], 1, MultiModalFusion, [concat]] # P3 fusion
  - [-1, 1, Conv, [256, 1, 1]] # fused P3
  - [[50, 53], 1, MultiModalFusion, [concat]] # P4 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P4
  - [[51, 54], 1, MultiModalFusion, [concat]] # P5 fusion
  - [-1, 1, Conv, [1024, 1, 1]] # fused P5
  - [[56, 58, 60], 1, Detect, [nc]]
