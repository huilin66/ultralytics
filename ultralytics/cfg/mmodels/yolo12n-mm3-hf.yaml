# yolo12n three-modality head fusion: per-modality head projections fuse P3/P4/P5 before one Detect.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
scale: n
multimodal:
  fusion: HF
  fusion_points: ["head_P3", "head_P4", "head_P5"]
  pretrained: false
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 35], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, true, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, true, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 52], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 50], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, false, -1]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 57], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, false, -1]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 54], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [16, 1, Conv, [512, 1, 1]] # head projection
  - [19, 1, Conv, [512, 1, 1]] # head projection
  - [22, 1, Conv, [1024, 1, 1]] # head projection
  - [38, 1, Conv, [512, 1, 1]] # head projection
  - [41, 1, Conv, [512, 1, 1]] # head projection
  - [44, 1, Conv, [1024, 1, 1]] # head projection
  - [60, 1, Conv, [512, 1, 1]] # head projection
  - [63, 1, Conv, [512, 1, 1]] # head projection
  - [66, 1, Conv, [1024, 1, 1]] # head projection
  - [[67, 70, 73], 1, MultiModalFusion, ["concat"]] # fuse neck P0
  - [-1, 1, Conv, [512, 1, 1]] # neck-P0-fused
  - [[68, 71, 74], 1, MultiModalFusion, ["concat"]] # fuse neck P1
  - [-1, 1, Conv, [512, 1, 1]] # neck-P1-fused
  - [[69, 72, 75], 1, MultiModalFusion, ["concat"]] # fuse neck P2
  - [-1, 1, Conv, [1024, 1, 1]] # neck-P2-fused
  - [[77, 79, 81], 1, Detect, ["nc"]] # Detect(P3, P4, P5)

