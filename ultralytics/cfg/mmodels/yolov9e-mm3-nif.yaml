# yolov9e three-modality nape-in fusion: P3/P4 fuse at encoder exits; P5 fuses inside the expanded nape.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
multimodal:
  fusion: NIF
  fusion_points: ["encoder_P3", "encoder_P4", "nape_P5"]
  pretrained: false

