# yolov9c three-modality encoder fusion: modality-specific encoders fuse P3/P4/P5, then one shared nape/neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
multimodal:
  fusion: EF
  fusion_points: ["encoder_P3", "encoder_P4", "encoder_P5"]
  pretrained: false

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [[6, 16, 26], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [512, 1, 1]] # P3-fused
  - [[8, 18, 28], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [512, 1, 1]] # P4-fused
  - [[10, 20, 30], 1, MultiModalFusion, ["concat"]] # fuse P5
  - [-1, 1, Conv, [512, 1, 1]] # P5-fused
  - [-1, 1, SPPELAN, [512, 256]]

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 1]]
  - [-1, 1, ADown, [256]]
  - [[-1, 40], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [[43, 46, 49], 1, Detect, ["nc"]]

