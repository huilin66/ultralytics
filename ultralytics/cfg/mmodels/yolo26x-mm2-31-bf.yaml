# YOLO26x two-modality backbone fusion, 3+1 layout: two modality-specific backbones, then fused P3/P4/P5 enter
# one shared neck/head. Input order: RGB (3) + one single-channel modality (thermal or depth).
# The detection head, loss and post-processing stay the stock YOLO26 end-to-end path.
nc: 80
channels: 4
scale: x
end2end: True
reg_max: 1
multimodal:
  input_sections: [3, 1]
  fusion: BF
  operator: concat
  fusion_points: [backbone_P3, backbone_P4, backbone_P5]
  share_weight: false
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ModalSplit, [[3, 1]]]
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 1, C2PSA, [1024]]
  - [[6, 18], 1, MultiModalFusion, [concat]] # P3 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P3
  - [[8, 20], 1, MultiModalFusion, [concat]] # P4 fusion
  - [-1, 1, Conv, [512, 1, 1]] # fused P4
  - [[12, 24], 1, MultiModalFusion, [concat]] # P5 fusion
  - [-1, 1, Conv, [1024, 1, 1]] # fused P5

head:
  - [30, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[31, 28], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[34, 26], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[37, 33], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[40, 30], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[36, 39, 42], 1, Detect, [nc]]
