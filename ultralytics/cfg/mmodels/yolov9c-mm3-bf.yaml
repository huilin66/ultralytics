# yolov9c three-modality backbone fusion: three complete modality backbones fuse P3/P4/P5, then one shared neck/head.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
multimodal:
  fusion: BF
  fusion_points: ["backbone_P3", "backbone_P4", "backbone_P5"]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, SPPELAN, [512, 256]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, SPPELAN, [512, 256]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]
  - [-1, 1, ADown, [256]]
  - [-1, 1, RepNCSPELAN4, [512, 256, 128, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, SPPELAN, [512, 256]]
  - [[6, 17, 28], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [512, 1, 1]] # P3-fused
  - [[8, 19, 30], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [512, 1, 1]] # P4-fused
  - [[11, 22, 33], 1, MultiModalFusion, ["concat"]] # fuse P5
  - [-1, 1, Conv, [512, 1, 1]] # P5-fused

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 37], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 35], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 1]]
  - [-1, 1, ADown, [256]]
  - [[-1, 42], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [-1, 1, ADown, [512]]
  - [[-1, 39], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]]
  - [[45, 48, 51], 1, Detect, ["nc"]]

