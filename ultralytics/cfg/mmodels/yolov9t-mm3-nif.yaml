# yolov9t three-modality nape-in fusion: P3/P4 fuse at encoder exits; P5 fuses inside the expanded nape.
# Input order: RGB (3) + thermal (1) + depth (1).
nc: 80
multimodal:
  fusion: NIF
  fusion_points: ["encoder_P3", "encoder_P4", "nape_P5"]

backbone:
  - [-1, 1, ModalSplit, [[3, 1, 1]]] # split the channel-stacked modalities
  - [0, 1, Index, [3, 0]]
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, ELAN1, [32, 32, 16]]
  - [-1, 1, AConv, [64]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [96]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [0, 1, Index, [1, 1]]
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, ELAN1, [32, 32, 16]]
  - [-1, 1, AConv, [64]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [96]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [0, 1, Index, [1, 2]]
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, ELAN1, [32, 32, 16]]
  - [-1, 1, AConv, [64]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [96]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [[6, 16, 26], 1, MultiModalFusion, ["concat"]] # fuse P3
  - [-1, 1, Conv, [64, 1, 1]] # P3-fused
  - [[8, 18, 28], 1, MultiModalFusion, ["concat"]] # fuse P4
  - [-1, 1, Conv, [96, 1, 1]] # P4-fused
  - [10, 1, SPPELAN, [128, 64]] # RGB nape
  - [20, 1, SPPELAN, [128, 64]] # thermal nape
  - [30, 1, SPPELAN, [128, 64]] # depth nape
  - [[35, 36, 37], 1, MultiModalFusion, ["concat"]] # fuse nape P5
  - [-1, 1, Conv, [128, 1, 1]] # fused nape P5

head:
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, nn.Upsample, ["None", 2, "nearest"]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [48]]
  - [[-1, 42], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [64]]
  - [[-1, 39], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [[45, 48, 51], 1, Detect, ["nc"]]

